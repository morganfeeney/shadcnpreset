name: Community Snapshot Refresh

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum preset codes to include in snapshot"
        required: false
        default: "2000"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          pnpm --version

      - name: Validate DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.SHADCNPRESET_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing SHADCNPRESET_DATABASE_URL repository secret."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tsx is installed
        run: |
          pnpm exec tsx --version
          test -e node_modules/tsx -o -e apps/shadcnpreset/node_modules/tsx

      - name: Refresh snapshot JSON
        env:
          DATABASE_URL: ${{ secrets.SHADCNPRESET_DATABASE_URL }}
          SNAPSHOT_LIMIT: ${{ github.event.inputs.limit || '2000' }}
        run: pnpm --filter shadcnpreset refresh:community-snapshot -- "$SNAPSHOT_LIMIT" github-cron

      - name: Create pull request
        id: create-pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SHADCNPRESET_GH_PAT || github.token }}
          commit-message: "chore(shadcnpreset): refresh community snapshot data"
          title: "chore(shadcnpreset): refresh community snapshot data"
          body: |
            Automated community snapshot refresh.

            - Regenerated `apps/shadcnpreset/data/community-presets-snapshot.json`
            - Source: scheduled GitHub Action
          branch: automation/community-snapshot-refresh
          delete-branch: true
          add-paths: |
            apps/shadcnpreset/data/community-presets-snapshot.json

      - name: Wait for checks and merge
        if: steps.create-pr.outcome == 'success' && steps.create-pr.outputs.pull-request-number != ''
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.SHADCNPRESET_GH_PAT || github.token }}
        run: |
          PR="${{ steps.create-pr.outputs.pull-request-number }}"

          # --auto merges immediately when main has no required status checks.
          # Wait for real check runs instead, then squash-merge.
          count=0
          for _ in $(seq 1 60); do
            count="$(gh pr view "$PR" --json statusCheckRollup --jq '.statusCheckRollup | length')"
            if [ "${count:-0}" -gt 0 ]; then
              break
            fi
            sleep 10
          done

          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::No checks appeared on PR #$PR within 10 minutes; refusing to merge."
            exit 1
          fi

          gh pr checks "$PR" --watch --fail-fast --interval 15
          gh pr merge "$PR" --squash --delete-branch

      - name: Report pull request permission fallback
        if: steps.create-pr.outcome == 'failure'
        run: |
          echo "::warning::Snapshot branch was pushed but PR creation is blocked for GITHUB_TOKEN."
          echo "::warning::Enable 'Allow GitHub Actions to create and approve pull requests' in repository settings, or set SHADCNPRESET_GH_PAT with repo scope."
